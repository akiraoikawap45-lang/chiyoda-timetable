<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>千代田線 綾瀬方面 時刻表</title>
  <meta name="theme-color" content="#00bb85">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>千代田線 綾瀬方面 時刻表</h1>
    <!-- 飾りの画像（読み上げ不要なのでaltは空） -->
    <img class="header-flower" src="image/flower-header.png" alt="" width="63" height="32">
  </header>

  <main>
    <!-- 運行情報 -->
    <section id="train-info" hidden></section>

    <div class="controls">
      <label>
        駅
        <select id="station"></select>
      </label>
      <div class="service-switch" role="group" aria-label="ダイヤ">
        <button type="button" data-service="weekday">平日</button>
        <button type="button" data-service="holiday">土休日</button>
      </div>
    </div>

    <!-- チェックした行き先は、綾瀬行き・北綾瀬行きと同じように折りたたむ（中身はapp.jsで作る） -->
    <fieldset id="fold-dests" class="fold-dests">
      <legend>表示しない行き先</legend>
    </fieldset>

    <p id="status"></p>

    <button type="button" id="show-earlier" hidden>前の時刻を表示</button>
    <div id="timetable"></div>
  </main>

  <!-- 乗換路線の運行情報（「乗換路線の運行情報があります」を押すと開く） -->
  <dialog id="transfer-dialog" class="dialog">
    <div class="dialog-head">
      <h2>乗換路線の運行情報</h2>
      <button type="button" class="dialog-close" aria-label="閉じる">×</button>
    </div>
    <div class="dialog-body"></div>
  </dialog>

  <!-- 列車の時刻（時刻表の列車を押すと開く） -->
  <dialog id="train-dialog" class="dialog">
    <div class="dialog-head">
      <h2></h2>
      <button type="button" class="dialog-close" aria-label="閉じる">×</button>
    </div>
    <div class="dialog-body"></div>
  </dialog>

  <footer>
    <!-- チャレンジ用（JR東日本・東武鉄道）の部分は、ライセンスが終わったらapp.jsで隠す（class="challenge"） -->
    <div class="challenge">
      <p>乗換路線の運行状況は以下の路線を対象にしています</p>
      <p>JR常磐快速線、JR武蔵野線（新松戸のりかえ）、東武アーバンパークライン＜野田線＞（柏のりかえ）、JR成田線（我孫子のりかえ）</p>
      <p>上記以外の路線は表示していません（京成松戸線、流鉄流山線等）</p>
    </div>

    <p class="credit-title">
      公共交通オープンデータセンター: <a href="https://ckan.odpt.org/" target="_blank" rel="noopener">https://ckan.odpt.org/</a>
    </p>
    <ul class="credit-list">
      <li>東京メトロのGTFSデータ・運行情報</li>
      <li class="challenge">JR東日本の列車時刻表・運行情報</li>
      <li class="challenge">東武鉄道の運行情報</li>
    </ul>
  </footer>

  <script src="app.js"></script>
</body>
</html>
