<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>千代田線 綾瀬方面 時刻表</title>
  <meta name="theme-color" content="#00bb85">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>千代田線 綾瀬方面 時刻表</h1>
    <!-- 飾りの画像（読み上げ不要なのでaltは空） -->
    <img class="header-flower" src="image/flower-header.png" alt="" width="63" height="32">
  </header>

  <main>
    <!-- 運行情報 -->
    <section id="train-info" hidden></section>

    <div class="controls">
      <label>
        駅
        <select id="station"></select>
      </label>
      <div class="service-switch" role="group" aria-label="ダイヤ">
        <button type="button" data-service="weekday">平日</button>
        <button type="button" data-service="holiday">土休日</button>
      </div>
    </div>

    <!-- チェックした行き先は、綾瀬行き・北綾瀬行きと同じように折りたたむ（中身はapp.jsで作る） -->
    <fieldset id="fold-dests" class="fold-dests">
      <legend>表示しない行き先</legend>
    </fieldset>

    <p id="status"></p>

    <button type="button" id="show-earlier" hidden>前の時刻を表示</button>
    <div id="timetable"></div>
  </main>

  <!-- 乗換路線の運行情報（「乗換路線の運行情報があります」を押すと開く） -->
  <dialog id="transfer-dialog" class="dialog">
    <div class="dialog-head">
      <h2>乗換路線の運行情報</h2>
      <button type="button" class="dialog-close" aria-label="閉じる">×</button>
    </div>
    <div class="dialog-body"></div>
  </dialog>

  <!-- 列車の時刻（時刻表の列車を押すと開く） -->
  <dialog id="train-dialog" class="dialog">
    <div class="dialog-head">
      <h2></h2>
      <button type="button" class="dialog-close" aria-label="閉じる">×</button>
    </div>
    <div class="dialog-body"></div>
  </dialog>

  <footer>
    <p>
      出典：<a href="https://www.odpt.org/" target="_blank" rel="noopener">公共交通オープンデータセンター</a>
      （東京メトロの時刻表データ、<a href="https://developer.odpt.org/terms" target="_blank" rel="noopener">公共交通オープンデータ基本ライセンス</a>）
    </p>
    <!-- チャレンジのライセンスが終わったら、app.jsでこの行を隠す -->
    <p id="challenge-credit">
      JR東日本・東武鉄道の運行情報とJR常磐線内の時刻は、公共交通オープンデータチャレンジ2026の限定ライセンスにより、2027年3月11日まで表示しています。
    </p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
